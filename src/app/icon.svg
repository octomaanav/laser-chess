<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#182034"/>
  <!-- laser: soft glow, core, hot centre -->
  <g stroke-linecap="round">
    <line x1="12.5" y1="19.5" x2="28.5" y2="5" stroke="#ff5a40" stroke-opacity="0.35" stroke-width="6"/>
    <line x1="12.5" y1="19.5" x2="28.5" y2="5" stroke="#ff5a40" stroke-width="2.6"/>
    <line x1="12.5" y1="19.5" x2="28.5" y2="5" stroke="#fff0e8" stroke-width="1"/>
  </g>
  <!-- beam head -->
  <circle cx="28.5" cy="5" r="4" fill="#ff5a40" fill-opacity="0.35"/>
  <circle cx="28.5" cy="5" r="2.2" fill="#fff0e8"/>
  <!-- sphinx emitter (teal token + dark barrel aimed along the beam) -->
  <rect x="3" y="17" width="12" height="12" rx="4" fill="#2fb0ab" stroke="#0e1424" stroke-width="2"/>
  <line x1="9" y1="23" x2="13.5" y2="18.5" stroke="#0e1424" stroke-width="3" stroke-linecap="round"/>
</svg>
