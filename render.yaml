# Render Blueprint — deploy with:  Render dashboard → New → Blueprint → pick this repo.
# (Or configure a Web Service manually with the same build/start commands.)
#
# This app must run as a persistent process (WebSockets + in-memory game rooms),
# so it's a single-instance Node "web" service — do NOT scale it horizontally.
services:
  - type: web
    name: laser-chess
    runtime: node
    plan: free
    # branch: main            # uncomment/edit if your default branch isn't `main`
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      # A stable random secret for signing admin session cookies (Render generates it once).
      - key: AUTH_SECRET
        generateValue: true
      # Your admin password — Render will prompt you to enter this (kept secret, not committed).
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: a Postgres URL (e.g. free Neon/Supabase) to persist setups + live games
      # across redeploys. Leave blank to keep games in memory. Tables auto-create on boot.
      # Also stores user accounts — required if you want accounts to survive a redeploy.
      - key: DATABASE_URL
        sync: false
      # Optional OAuth sign-in. Set both id+secret for a provider to enable its button.
      # Register the callback URL <your-origin>/api/auth/oauth/<provider>/callback.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
